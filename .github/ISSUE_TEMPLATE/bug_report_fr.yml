name: "Français — Signaler un problème"
description: Signaler un problème reproductible dans PurrLock
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Version de PurrLock
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Version de macOS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Processeur du Mac
      options:
        - Apple silicon
        - Intel
        - Inconnu
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire le problème
      description: N’indiquez aucun mot de passe ni texte saisi au clavier.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
