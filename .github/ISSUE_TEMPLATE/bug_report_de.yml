name: "Deutsch — Fehler melden"
description: Einen reproduzierbaren Fehler in CatsLock melden
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: CatsLock-Version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS-Version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac-Prozessor
      options:
        - Apple silicon
        - Intel
        - Unbekannt
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      description: Keine Passwörter oder eingegebenen Tastaturinhalte angeben.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
