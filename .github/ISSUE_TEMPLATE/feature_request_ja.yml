name: "日本語 — 改善を提案"
description: PurrLock の改善を提案する
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: どのような問題を解決しますか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決方法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false
