name: "English — Bug report"
description: Report a reproducible problem with PurrLock
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: PurrLock version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac processor
      options:
        - Apple silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include passwords or text typed on the keyboard.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
