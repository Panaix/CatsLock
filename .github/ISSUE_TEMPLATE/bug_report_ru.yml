name: "Русский — Сообщить об ошибке"
description: Сообщить о воспроизводимой проблеме CatsLock
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Версия CatsLock
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Версия macOS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Процессор Mac
      options:
        - Apple silicon
        - Intel
        - Не знаю
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить проблему
      description: Не указывайте пароли или текст, введённый с клавиатуры.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
