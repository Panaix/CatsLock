name: "中文 — 报告问题"
description: 报告 CatsLock 中可复现的问题
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: CatsLock 版本
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac 处理器
      options:
        - Apple silicon
        - Intel
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请勿提供密码或键盘输入的文本。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
